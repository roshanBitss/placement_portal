{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <style>
        body {
            background-color: red !important;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light" style="background: url('{% static "images/login_background.png" %}') no-repeat center center fixed; background-size: cover;">

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4 login">
                <div class="card shadow-lg p-4 border border-danger">
                    <div class="text-center">
                        <img src="{% static 'images/logo.png' %}" alt="Logo" class="img-fluid mb-3" style="max-width: 150px;">
                    </div>
                    <form method="post" action="{% url 'login_user' %}">
                        {% csrf_token %}
                        {% if messages %}
                        <div class="alert alert-danger" role="alert">
                            {% for message in messages %}
                            {{ message }}
                            {% endfor %}
                        </div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="username" class="form-label">Username:</label>
                            <input type="text" id="username" class="form-control" placeholder="Enter your username" required name="username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password:</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter your password" required name="password">
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault">
                            <label class="form-check-label" for="flexSwitchCheckDefault">👈 Show Password</label>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Login</button>
                    </form>
                   <!-- <a href="#" class="d-block text-center mt-3">Having trouble logging in?</a> -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const passwordField = document.getElementById("password");
        const togglePasswordSwitch = document.getElementById("flexSwitchCheckDefault");

        togglePasswordSwitch.addEventListener("change", function() {
            passwordField.type = this.checked ? "text" : "password";
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
